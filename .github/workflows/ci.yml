name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout Registry Repository
        uses: actions/checkout@v7
        with:
          path: knapset-registry

      - name: Checkout Knapset Core
        uses: actions/checkout@v7
        with:
          repository: knapset-dev/knapset
          path: knapset
          token: ${{ secrets.CORE_CHECKOUT_TOKEN || github.token }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run AST Security & Submission Validator
        working-directory: knapset-registry
        run: |
          python3 scripts/validate_submission.py

      - name: Verify Master Index Consistency (registry.json)
        working-directory: knapset-registry
        run: |
          python3 scripts/build_index.py --check

      - name: Run Full Extension Test Suite
        working-directory: knapset-registry
        run: |
          python3 -m unittest discover tests
